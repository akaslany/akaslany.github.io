<meta property="og:description" content="국립소방연구원 설문 조사입니다. 약 10분 소요됩니다.">

<body>

<style>
/* Layout: one column survey sheet, navy agency band on top, one section per step, sticky progress */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#1B2430; --muted:#5B6677; --line:#D5DCE6;
  --band:#1F3A5F; --band-ink:#FFFFFF; --band-sub:#B9C8DD;
  --brand:#1F3A5F; --brand-ink:#FFFFFF; --heading:#1F3A5F; --steel:#4A6FA5;
  --sel:#E3EAF4; --sel-line:#1F3A5F; --soft:#F6F8FB; --alert:#B3261E; --alert-bg:#FCEEEC; --pin:#F2B705;
  --f-display:'IBM Plex Sans KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151E; --surface:#172130; --ink:#E5EAF1; --muted:#9AA7B9; --line:#2B3B52;
  --band:#13233A; --band-ink:#F1F5FA; --band-sub:#8EA4C2;
  --brand:#3E6BA9; --brand-ink:#FFFFFF; --heading:#C3D4EC; --steel:#8DAEDC;
  --sel:#203452; --sel-line:#8DAEDC; --soft:#1B2738; --alert:#F2938B; --alert-bg:#3A1F1E; --pin:#F2B705;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151E; --surface:#172130; --ink:#E5EAF1; --muted:#9AA7B9; --line:#2B3B52;
  --band:#13233A; --band-ink:#F1F5FA; --band-sub:#8EA4C2;
  --brand:#3E6BA9; --brand-ink:#FFFFFF; --heading:#C3D4EC; --steel:#8DAEDC;
  --sel:#203452; --sel-line:#8DAEDC; --soft:#1B2738; --alert:#F2938B; --alert-bg:#3A1F1E; --pin:#F2B705;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;margin:0;word-break:keep-all;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.band{background:var(--band);color:var(--band-ink)}
header.band .wrap{padding-block:22px 0;display:grid;gap:4px}
header.band .hd-text{display:grid;gap:4px;padding-bottom:20px}
.hero{background:var(--surface);margin-left:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));margin-right:calc(-1 * max(16px, env(safe-area-inset-right, 0px)));padding:18px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));display:flex;justify-content:flex-end;border-bottom:1px solid var(--line)}
.hero svg{display:block;width:min(66%,290px);height:auto}
@media (min-width:640px){.hero{margin-left:0;margin-right:0;border-radius:0}}
.org{font-size:13px;color:var(--band-sub);letter-spacing:.04em}
.org b{display:inline-block;width:8px;height:8px;background:var(--pin);margin-right:8px;vertical-align:1px}
h1{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.35;margin:0;text-wrap:balance}
.prog{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.prog .wrap{padding-block:10px;display:flex;align-items:center;gap:12px}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--steel);transition:width .3s}
.prog span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
main .wrap{padding-block:20px 40px;display:grid;gap:16px}
.sec-title{display:flex;align-items:stretch;border-bottom:3px solid var(--brand);background:var(--surface)}
.sec-title .no{background:var(--sel);color:var(--heading);font-family:var(--f-display);font-weight:700;font-size:15px;padding:10px 14px;display:flex;align-items:center}
.sec-title .tx{padding:10px 14px;font-family:var(--f-display);font-weight:600;font-size:17px;color:var(--heading)}
.note{background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;font-size:14.5px;color:var(--muted)}
.note p{margin:0}.note p+p{margin-top:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;display:grid;gap:14px;scroll-margin-top:80px}
.card.missing{border-color:var(--alert);box-shadow:0 0 0 1px var(--alert)}
.q{font-weight:500;font-size:16.5px;margin:0;text-wrap:pretty}
.q .n{font-family:var(--f-display);font-weight:700;color:var(--heading);margin-right:6px}
.q .opt{font-size:13px;color:var(--muted);font-weight:400;margin-left:4px}
.hint{font-size:13.5px;color:var(--muted);margin:-8px 0 0}
.err{font-size:13.5px;color:var(--alert);margin:0}
.opts{display:grid;gap:8px}
.opt-btn{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font:inherit;font-size:15.5px;cursor:pointer;line-height:1.45}
.opt-btn .mk{flex:none;width:20px;height:20px;border:2px solid var(--line);border-radius:50%;margin-top:1px;display:grid;place-items:center}
.opt-btn.multi .mk{border-radius:4px}
.opt-btn[aria-checked="true"]{background:var(--sel);border-color:var(--sel-line)}
.opt-btn[aria-checked="true"] .mk{border-color:var(--sel-line);background:var(--sel-line)}
.opt-btn[aria-checked="true"] .mk::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--surface)}
.opt-btn.multi[aria-checked="true"] .mk::after{width:10px;height:6px;border-radius:0;background:none;border:2px solid var(--surface);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.opt-btn:focus-visible,.sc:focus-visible,.nav button:focus-visible,textarea:focus-visible,input:focus-visible,.grid-btn:focus-visible{outline:3px solid var(--steel);outline-offset:2px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sc{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 2px 8px;font:inherit;cursor:pointer;display:grid;gap:4px;justify-items:center;min-width:0}
.sc b{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.sc small{font-size:11.5px;line-height:1.25;color:var(--muted);text-align:center;word-break:keep-all}
.sc[aria-checked="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.sc[aria-checked="true"] small{color:var(--brand-ink)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid-btn{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 4px;font:inherit;font-size:15px;cursor:pointer;word-break:keep-all}
.grid-btn[aria-checked="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
textarea,input[type=text]{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px;font:inherit;font-size:15.5px}
textarea{min-height:110px;resize:vertical}
.links{display:grid;gap:8px}
.box{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.box div{display:grid;grid-template-columns:7.5em 1fr;border-top:1px solid var(--line)}
.box div:first-child{border-top:0}
.box dt{background:var(--soft);color:var(--heading);font-weight:700;font-size:14px;padding:10px 12px}
.box dd{margin:0;padding:10px 12px;font-size:14.5px;min-width:0}
.box-note{margin:-6px 0 0;font-size:13.5px;color:var(--muted)}
.links a{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;color:var(--heading);text-decoration:none;font-weight:500}
.links a span{font-size:13px;color:var(--muted);font-weight:400;overflow-wrap:anywhere}
.letter{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;display:grid;gap:10px;font-size:15.5px}
.letter p{margin:0}.letter .sig{color:var(--muted);font-size:14px}
.nav{display:flex;gap:10px;margin-top:4px}
.nav button{flex:1;font:inherit;font-weight:700;font-size:16px;padding:14px;border-radius:8px;cursor:pointer;border:1px solid var(--brand)}
.nav .prev{background:var(--surface);color:var(--heading);border-color:var(--line);flex:0 0 34%}
.nav .next{background:var(--brand);color:var(--brand-ink)}
.nav button[disabled]{opacity:.6;cursor:wait}
.banner{background:var(--alert-bg);color:var(--alert);border-radius:8px;padding:10px 14px;font-size:14px}
.done{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:32px 20px;display:grid;gap:10px;justify-items:center;text-align:center}
.done .ck{width:56px;height:56px;border-radius:50%;background:var(--brand);display:grid;place-items:center}
.done .ck::after{content:"";width:22px;height:12px;border:4px solid var(--brand-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(2px,-3px)}
.done h2{font-family:var(--f-display);margin:6px 0 0;font-size:20px;color:var(--heading)}
.done p{margin:0;color:var(--muted)}
.demo{font-size:12.5px;color:var(--muted);text-align:center}
footer .wrap{padding-block:0 32px;font-size:12.5px;color:var(--muted);text-align:center}
/* compact rhythm */
body{line-height:1.5}
main .wrap{padding-block:12px 28px;gap:12px}
.card{padding:14px 12px;gap:10px}
.q{font-size:15.5px;line-height:1.45}
.hint{margin:-4px 0 0;font-size:13px}
.opts{gap:6px}
.opt-btn{padding:10px 12px;font-size:15px;gap:10px}
.opts.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.sec-title .no{padding:8px 12px;font-size:14px}
.sec-title .tx{padding:8px 12px;font-size:16px}
.note{padding:10px 12px;font-size:14px}
.letter{padding:16px 14px;gap:8px;font-size:15px}
.grid{gap:5px}
.grid-btn{padding:9px 2px;font-size:14.5px}
.grid.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
body.compact header.band .wrap{padding-block:10px 0}
body.compact header.band .hd-text{padding-bottom:10px;gap:0}
body.compact .org{display:none}
body.compact h1{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
mark.hl{background:linear-gradient(transparent 52%, var(--hl) 52%);color:inherit;font-weight:700;padding:0 1px}
.alert-note{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line);border-radius:var(--r);padding:10px 12px;font-size:14px;font-weight:500}
.alert-note p{margin:0}
/* matrix table */
.legend{margin:-2px 0 0;font-size:12px;line-height:1.5;color:var(--muted)}
.legend b{color:var(--heading)}
.legend span{margin:0 5px;color:var(--line)}
.mtable{display:grid;margin:0 -4px}
.mtr{display:grid;grid-template-columns:minmax(0,1fr) repeat(var(--mc),38px);align-items:center;border-top:1px solid var(--line);padding:4px 4px;border-radius:6px;scroll-margin-top:90px}
.mtable.narrow .mtr{grid-template-columns:2.4em repeat(var(--mc),minmax(0,1fr))}
.mhead{border-top:0;padding-block:0 4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 41px);background:var(--surface);z-index:2}
.mh{text-align:center;display:grid;justify-items:center;align-content:start;gap:2px;line-height:1.15}
.mh b{font-family:var(--f-display);font-size:14px;color:var(--heading);font-variant-numeric:tabular-nums}
.mh small{font-size:10.5px;line-height:1.2;color:var(--muted);word-break:keep-all;text-align:center;padding:0 1px}
.mlab{margin:0;font-size:13px;line-height:1.35;letter-spacing:-0.2px;padding-right:6px;min-width:0}
.mlab span{color:var(--heading);font-weight:700}
.mtable.narrow .mlab{font-weight:600;padding-right:2px}
.mcell{height:40px;width:100%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;padding:0}
.mcell i{width:22px;height:22px;border:2px solid var(--line);border-radius:50%;display:block;background:var(--surface)}
.mcell[aria-checked="true"] i{border-color:var(--brand);background:var(--brand);box-shadow:inset 0 0 0 4px var(--surface)}
.mcell:focus-visible{outline:3px solid var(--steel);outline-offset:-3px;border-radius:8px}
.mtr.missing{background:var(--alert-bg)}
/* header: uniform numbers, anchors on one line */
.mhead.mtr{grid-template-rows:auto auto;row-gap:2px}
.mhead.mtr .mlab{grid-row:1 / span 2}
.mhead.mtr .ancwrap{grid-column:2 / -1;grid-row:1}
.mhead.mtr .mh{grid-row:2}
.anc{display:flex;justify-content:space-between;gap:8px;font-size:11px;line-height:1.3;color:var(--muted)}
.anc span:last-child{text-align:right}
/* stacked rows for long item text: text on its own line, circles below */
.mtable.stack .mhead{display:grid;gap:2px;padding:0 4px 4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 41px);background:var(--surface);z-index:2;border-bottom:1px solid var(--line)}
.mcells{display:grid;grid-template-columns:repeat(var(--mc),minmax(0,1fr))}
.mtable.stack .mtr{grid-template-columns:1fr;gap:0;padding:7px 2px 0;border-top:0;border-bottom:1px solid var(--line)}
.mtable.stack .mtr:last-child{border-bottom:0}
.mtable.stack .mlab{font-size:13px;line-height:1.35;letter-spacing:-0.4px;padding-right:0;font-weight:700;color:var(--ink)}
.mtable.stack .mlab span{color:var(--heading)}
.mtable.stack .mcell{height:34px}
.mcell i{width:21px;height:21px}
/* dropdown rows (issuance method) */
.srows{display:grid}
.srow.mtr{grid-template-columns:minmax(0,7.4em) minmax(0,1fr);gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.srow.mtr:first-child{border-top:0}
.srow select{width:100%;min-width:0;font:inherit;font-size:14.5px;padding:9px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.srow select:focus-visible{outline:3px solid var(--steel);outline-offset:1px}

.mtr:has(.mcell[aria-checked="true"]) .mlab{color:var(--ink)}
/* number card: question and input on one line */
.ncard{grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:10px;row-gap:4px}
.ncard .q{grid-column:1}
.ncard .numrow{grid-column:2;grid-row:1}
.ncard .hint,.ncard .err{grid-column:1 / -1;margin:0}
.numrow{gap:6px}
.numrow{display:flex;align-items:center;flex-wrap:nowrap}
.numrow .num{width:4.8em;min-width:0;box-sizing:border-box;font-size:17px;padding:8px 10px;text-align:center}
.unit{font-size:15px;flex:none;white-space:nowrap}
.resume{background:var(--sel);border:1px solid var(--sel-line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.resume p{margin:0}
.maxmsg{margin:0;font-size:13px;color:var(--alert)}
.done{padding:28px 18px}

/* intro: title and illustration in one band, short intro */
header.band .wrap.hd-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:12px;padding-block:18px}
header.band .wrap.hd-row .hd-text{padding-bottom:0}
header.band .wrap.hd-row .hero{margin:0;padding:6px;background:var(--hero-bg);border-radius:14px;border:0;display:block}
header.band .wrap.hd-row .hero svg{width:118px;height:auto}
header.band h1{font-size:19px}
body.compact header.band .wrap.hd-row{grid-template-columns:1fr;padding-block:10px}
body.compact header.band h1{font-size:14px}
.intro{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px;display:grid;gap:8px;font-size:15px;line-height:1.55}
.intro p{margin:0}
.intro .lead{font-weight:700;color:var(--heading)}
.facts{margin:4px 0 0;padding-top:10px;border-top:1px solid var(--line);display:grid;gap:5px;font-size:13.5px;letter-spacing:-0.2px}
.facts div{display:grid;grid-template-columns:6.3em minmax(0,1fr)}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:500}
details.full{font-size:13.5px;color:var(--muted);line-height:1.55}
details.full summary{cursor:pointer;color:var(--steel);font-weight:500;padding:2px 0}
details.full p{margin:6px 0 0}
.consent-line{margin:0;font-size:13px;color:var(--muted);text-align:center;padding:0 6px}
.nav.col{flex-direction:column;gap:4px}
.nav .ghost{background:transparent;border:0;color:var(--muted);font-weight:500;font-size:14px;padding:10px}
.nav .ghost:focus-visible{outline:3px solid var(--steel);outline-offset:2px}

footer .wrap.foot{display:grid;gap:10px;justify-items:center}
footer #foot{margin:0}
.maker{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.maker img{height:24px;width:auto}
@media (prefers-color-scheme:dark){.maker img{background:#FFFFFF;border-radius:4px;padding:3px 6px;box-sizing:content-box}}
.contact{margin:0;font-size:13px;color:var(--muted)}
.box-note.contact{margin-top:-4px}
body.compact .maker{display:none}

.intro .to{font-weight:700;color:var(--kw)}
b.kw{color:var(--kw);font-weight:800}
b.eq1{color:#C2410C} b.eq2{color:#0B7285} b.eq3{color:#6741D9} b.eq4{color:#2B8A3E} b.eq5{color:#A61E4D} b.eq6{color:#1864AB}
:root{--kw:#0047B3}
@media (prefers-color-scheme:dark){:root{--kw:#74A8FF}
b.eq1{color:#FF922B} b.eq2{color:#3BC9DB} b.eq3{color:#B197FC} b.eq4{color:#69DB7C} b.eq5{color:#F783AC} b.eq6{color:#74C0FC}}
@media (max-width:360px){.grid.g5{grid-template-columns:repeat(4,1fr)}.opts.c3{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<header class="band"><div class="wrap hd-row">
  <div class="hd-text">
    <div class="org"><b></b><span id="org"></span></div>

  thanks: '설문에 참여해 주셔서 감사합니다. 응답이 정상적으로 제출되었습니다.',
  contact: '설문 화면·답례품 문의: ㈜클레뷰 hanmh@clevue.com',
  declined: '설문 참여에 동의하지 않으셔서 설문을 종료합니다. 감사합니다.'
};

/* 문항 하나씩 한 화면에 보이도록 화면 나누기 (keep 표시 화면은 그대로) */
(function splitPages(){
  const out = [];
  SURVEY.pages.forEach(pg => {
    if (pg.keep){ out.push(pg); return; }
    pg.items.forEach((it, i) => {
      const sub = {no: pg.no, title: pg.title, items: [it]};
      if (pg.note && i === 0) sub.note = pg.note;
      if (pg.alert && it.type === 'matrix') sub.alert = (pg.alert === DNOTE && i === 0) ? DNOTE : DNOTE2;
      out.push(sub);
    });
  });
  SURVEY.pages = out;
})();

/* 응답 저장 주소: 구글 Apps Script 웹 앱 주소 (외부 서버에 올릴 때 사용) */
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbyKe85VKJ67XqTKNOweT0s_14ULl7YHx0Z4lAEiS_KY4_DOHznCX79Px5teHOtOmi1q/exec';
const LIVE = typeof google !== 'undefined' && google.script && google.script.run;
const DEMO = !LIVE && !ENDPOINT;

const $ = s => document.querySelector(s);
const ESC_MAP = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const esc = s => Array.from(String(s), c => ESC_MAP[c] || c).join('');
const KEY = 'survey-draft:' + SURVEY.title;
const DONEKEY = 'survey-done:' + SURVEY.title;
const reduceMotion = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e) { return true; } };

const digitsOf = v => Array.from(String(v == null ? '' : v)).filter(c => c >= '0' && c <= '9').join('');
const phoneOk = v => { const d = digitsOf(v); return d.length >= 10 && d.length <= 11 && d.slice(0,2) === '01'; };
const phoneFmt = v => { const d = digitsOf(v); return d.length === 11 ? d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7) : d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6); };
const numOk = (it, v) => { const d = digitsOf(v); if (!d.length || d.length > 4) return false; const n = Number(d); return n >= it.min && n <= it.max; };

/* 주관식 성의 확인: 자음·모음만, 같은 글자 반복, 숫자·기호만, 키보드 연타, 너무 짧은 입력을 막음 */
const OKWORDS = ['없음','없습니다','없어요','특별히없음','해당없음','없다','모름','잘모르겠음'];
const MASH = ['qwer','asdf','zxcv','wert','sdfg','xcvb','qwert','asdfg','zxcvb','abcd','aaaa'];
function textOk(v, minLen){
  const chars = Array.from(String(v || '')).filter(c => c !== ' ' && c !== '\n' && c !== '\t');
  const flat = chars.join('');
  if (OKWORDS.includes(flat)) return true;
  if (chars.length < minLen) return false;
  let jamo = 0, syl = 0, lat = 0;
  chars.forEach(c => { const k = c.charCodeAt(0);
    if (k >= 0x3131 && k <= 0x318E) jamo++;
    else if (k >= 0xAC00 && k <= 0xD7A3) syl++;
    else if ((k >= 65 && k <= 90) || (k >= 97 && k <= 122)) lat++; });
  if (syl + lat === 0) return false;
  if (jamo * 2 > chars.length) return false;
  if (new Set(chars).size === 1) return false;
  if (syl === 0 && MASH.some(m => flat.toLowerCase().includes(m))) return false;
  if (chars.length >= 4 && new Set(chars).size * 4 < chars.length) return false;
  return true;
}
const visible = it => !it.showIf || [].concat(ans[it.showIf.q] == null ? [] : ans[it.showIf.q]).some(v => it.showIf.in.includes(v));
const isReq = it => it.required !== false;
const rowKey = (it, r) => it.id + '_' + (r + 1);
const hasVal = it => { const v = ans[it.id]; return v != null && String(v).trim() !== ''; };
const invalid = it => isReq(it) ? !answered(it) : (it.type === 'text' && hasVal(it) && !textOk(ans[it.id], 2));
const JUNK = '알아볼 수 있는 내용으로 적어 주세요. (자음·모음만 입력하거나 같은 글자를 반복하면 넘어가지 않습니다)';
function errMsg(it){
  const v = ans[it.id];
  if (it.type === 'text' && hasVal(it)) return JUNK + (isReq(it) ? '' : ' 의견이 없으시면 빈칸으로 두셔도 됩니다.');
  if (it.etc && (it.type === 'multi' ? (Array.isArray(v) && v.includes(it.etc)) : v === it.etc) && String(etcText[it.id]||'').trim()) return '기타 내용을 ' + JUNK;
  return null;
}

function answered(it){
  const v = ans[it.id];
  if (it.type === 'matrix') return it.rows.every((r, i) => ans[rowKey(it, i)] != null);
  if (it.type === 'text') return !!(v && String(v).trim()) && textOk(v, 2);
  if (it.type === 'phone') return phoneOk(v);
  if (it.type === 'number') return numOk(it, v);
  if (it.type === 'multi') return Array.isArray(v) && v.length > 0 && (!it.etc || !v.includes(it.etc) || textOk(etcText[it.id], 2));
  if (it.type === 'single' && it.etc && v === it.etc) return textOk(etcText[it.id], 2);
  return v != null;
}

/* 남은 시간 계산: 입력 단위당 약 6초, 서술형 40초 */
function unitsOf(it){ if (it.type === 'matrix') return it.rows.length; if (it.type === 'text') return 7; return 1; }
function remainMin(){
  let u = 0;
  SURVEY.pages.forEach((pg, i) => { if (i < step) return; pg.items.forEach(it => { if (!visible(it)) return; if (i === step && answered(it)) return; u += unitsOf(it); }); });
  return Math.max(1, Math.round(u * 6 / 60));
}

function saveDraft(){
  try { localStorage.setItem(KEY, JSON.stringify({ans, etcText, step, startedAt, t: Date.now()})); } catch(e) {}
}
function loadDraft(){
  try { const s = localStorage.getItem(KEY); if (!s) return null; const d = JSON.parse(s); if (Date.now() - d.t > 1000*60*60*24*7) return null; return d; } catch(e) { return null; }
}
function clearDraft(){ try { localStorage.removeItem(KEY); } catch(e) {} }

function render(){
  const P = SURVEY.pages, v = $('#view');
  const inPages = step >= 0 && step < P.length && !finished;
  $('#prog').hidden = !inPages;
  $('#hero').hidden = inPages;
  document.body.classList.toggle('compact', inPages);
  if (inPages){
    $('#barfill').style.width = ((step + 1) / P.length * 100) + '%';
    $('#progtx').textContent = '약 ' + remainMin() + '분 남음';
  }
  if (finished){ v.innerHTML = doneHTML(); return; }
  if (step < 0){ v.innerHTML = introHTML(); bindIntro(); return; }
  const pg = P[step];
  let h = `<div class="sec-title"><div class="no">${esc(pg.no)}</div><div class="tx">${esc(pg.title)}</div></div>`;
  if (pg.alert) h += `<div class="alert-note">${pg.alert.map(t=>`<p>${esc(t)}</p>`).join('')}</div>`;
  if (pg.note) h += `<div class="note">${pg.note.map(t=>`<p>${esc(t)}</p>`).join('')}</div>`;
  if (pg.box) h += `<dl class="box">${pg.box.map(r=>`<div><dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd></div>`).join('')}</dl>` + (pg.boxNote ? `<p class="box-note">${esc(pg.boxNote)}</p>` : '') + (pg.box && SURVEY.contact ? `<p class="box-note contact">${esc(SURVEY.contact)}</p>` : '');
  pg.items.forEach(it => { if (visible(it)) h += itemHTML(it); });
  const last = step === P.length - 1;
  h += `<div id="msg"></div><div class="nav"><button class="prev" id="prev" type="button">이전</button><button class="next" id="next" type="button">${last ? '제출하기' : '다음'}</button></div>`;
  v.innerHTML = h;
  bindItems(pg); bindNav();
}

function introHTML(){

  return `${resume}<div class="intro">

    <dl class="facts">${I.facts.map(f=>`<div><dt>${esc(f[0])}</dt><dd>${esc(f[1])}</dd></div>`).join('')}</dl>
    <details class="full"><summary>조사 안내 전문 보기</summary>${I.letter.map(t=>`<p>${esc(t)}</p>`).join('')}</details>
  </div>

  ${!DEMO ? '' : '<p class="demo">미리보기 화면입니다. 여기서 제출한 응답은 저장되지 않습니다.</p>'}`;

function bindIntro(){
  const go = () => { step = 0; render(); window.scrollTo(0,0); };
  $('#start').onclick = () => { if (!loadDraft()) startedAt = Date.now(); ans.CONSENT = 1; go(); };
  $('#decline').onclick = () => { ans.CONSENT = 2; submit($('#decline'), 'declined'); };
  const r = $('#resume'), f = $('#fresh');
  if (r) r.onclick = () => { const d = loadDraft(); if (d){ ans = d.ans || {}; etcText = d.etcText || {}; startedAt = d.startedAt || Date.now(); step = Math.min(d.step, SURVEY.pages.length - 1); } ans.CONSENT = 1; render(); window.scrollTo(0,0); };
  if (f) f.onclick = () => { clearDraft(); ans = {}; etcText = {}; startedAt = Date.now(); render(); };
}

const EQC = [['특수방화복','eq1'],['방화헬멧','eq2'],['방화두건','eq3'],['방화신발','eq4'],['방화장갑','eq5'],['공기호흡기','eq6']];
function eqCls(t){ for (const e of EQC){ if (String(t).indexOf(e[0]) === 0) return e[1]; } return ''; }
function eqLab(t){ const c = eqCls(t); return c ? '<b class="' + c + '">' + esc(t) + '</b>' : esc(t); }
function qText(it){
  const t = String(it.text);
  if (!it.em || t.indexOf(it.em) < 0) return esc(t);
  const i = t.indexOf(it.em);
  return esc(t.slice(0, i)) + '<b class="kw ' + eqCls(it.em) + '">' + esc(it.em) + '</b>' + esc(t.slice(i + it.em.length));
}
function optCols(it){
  const m = Math.max.apply(null, it.options.map(o => String(o).length));
  if (it.options.length === 2 && m <= 8) return 2;
  if (m <= 4) return 3;
  if (m <= 11) return 2;
  return 1;
}
function matrixHTML(it){
  const n = it.cols.length;
  if (it.select){
    return `<div class="srows">` + it.rows.map((r, i) => { const k = rowKey(it, i); const cur = ans[k];
      return `<div class="srow mtr" id="r-${k}"><label class="mlab" for="s-${k}"><span>${i+1})</span> ${esc(r)}</label><select id="s-${k}" data-sk="${k}"><option value="">선택해 주세요</option>` +
        it.cols.map(c => `<option value="${c[1]}"${cur===c[1] ? ' selected' : ''}>${esc(c[0])}</option>`).join('') + `</select></div>`; }).join('') + `</div>`;
  }
  const stack = !it.narrow;
  let h = `<div class="mtable${it.narrow ? ' narrow' : ''}${stack ? ' stack' : ''}" style="--mc:${n}" role="table">`;
  const head = it.cols.map(c => `<div class="mh" role="columnheader">${it.num || it.narrow ? `<b>${c[1]}</b>` : ''}${it.narrow ? '' : `<small>${esc(c[0])}</small>`}</div>`).join('');
  const anchors = '';
  if (stack) h += `<div class="mhead" role="row">${anchors}<div class="mcells">${head}</div></div>`;
  else h += `<div class="mhead mtr" role="row"><div class="mlab">${it.unitHead ? esc(it.unitHead) : ''}</div>${anchors ? `<div class="ancwrap">${anchors}</div>` : ''}${head}</div>`;
  h += it.rows.map((r, i) => { const k = rowKey(it, i); const cur = ans[k];
    const cells = it.cols.map(c => `<button type="button" class="mcell" role="radio" data-k="${k}" data-v="${c[1]}" aria-checked="${cur===c[1]}" aria-label="${esc(r)}: ${esc(c[0])}"><i></i></button>`).join('');
    const lab = `<div class="mlab">${it.rows.length > 2 ? `<span>${i+1})</span> ` : ''}${esc(r)}</div>`;
    return stack ? `<div class="mtr" id="r-${k}" role="radiogroup" aria-label="${esc(r)}">${lab}<div class="mcells">${cells}</div></div>`
                 : `<div class="mtr" id="r-${k}" role="radiogroup" aria-label="${esc(r)}">${lab}${cells}</div>`; }).join('');
  return h + `</div>`;
}
function scaleBtns(it, key, cur){
  if (it.chips){
    return `<div class="chips" role="radiogroup">` + it.cols.map(c => `<button type="button" class="chip" role="radio" data-k="${key}" data-v="${c[1]}" aria-checked="${cur===c[1]}">${esc(c[0])}</button>`).join('') + `</div>`;
  }
  return `<div class="scale" role="radiogroup">` + it.cols.map(c => `<button type="button" class="sc" role="radio" data-k="${key}" data-v="${c[1]}" aria-checked="${cur===c[1]}">${it.num ? `<b>${c[1]}</b>` : ''}<small>${esc(c[0])}</small></button>`).join('') + `</div>`;
}

function itemHTML(it){
  const req = isReq(it) ? '' : '<span class="opt">(선택)</span>';
  let h = `<section class="card${it.type === 'number' ? ' ncard' : ''}${it.type === 'matrix' ? ' mcard' : ''}" id="c-${it.id}"><p class="q">${it.n ? `<span class="n">${esc(it.n)}.</span>` : ''}${qText(it)}${req}</p>`;
  if (it.hint) h += `<p class="hint">${esc(it.hint)}</p>`;
  const v = ans[it.id];
  if (it.type === 'matrix'){
    h += matrixHTML(it);
  } else if (it.type === 'single' || it.type === 'multi'){
    const multi = it.type === 'multi';
    h += `<div class="opts c${optCols(it)}" role="${multi?'group':'radiogroup'}">` + it.options.map((o,i)=>{
      const on = multi ? (Array.isArray(v) && v.includes(i+1)) : v === i+1;
      return `<button type="button" class="opt-btn${multi?' multi':''}" role="${multi?'checkbox':'radio'}" data-id="${it.id}" data-v="${i+1}" aria-checked="${on}"><span class="mk"></span><span>${esc(o)}</span></button>`;
    }).join('') + `</div>`;
    if (it.etc){ const showEtc = multi ? (Array.isArray(v) && v.includes(it.etc)) : v === it.etc; h += `<input type="text" id="etc-${it.id}" maxlength="200" placeholder="기타 내용을 적어 주세요" value="${esc(etcText[it.id]||'')}" ${showEtc?'':'hidden'}>`; }
  } else if (it.type === 'grid'){
    h += `<div class="grid${it.cols === 5 ? ' g5' : ''}" role="radiogroup">` + it.options.map((o,i)=>`<button type="button" class="grid-btn" role="radio" data-id="${it.id}" data-v="${i+1}" aria-checked="${v===i+1}">${esc(o)}</button>`).join('') + `</div>`;
  } else if (it.type === 'number'){
    h += `<div class="numrow"><input type="text" id="t-${it.id}" data-id="${it.id}" class="num" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="${esc(it.ph||'')}" value="${esc(v||'')}" aria-label="${esc(it.text)}"><span class="unit">${esc(it.unit)}</span></div>`;
  } else if (it.type === 'phone'){
    h += `<input type="tel" id="t-${it.id}" data-id="${it.id}" inputmode="numeric" autocomplete="off" maxlength="13" placeholder="010-0000-0000" value="${esc(v||'')}">`;
  } else if (it.type === 'text'){
    h += `<textarea id="t-${it.id}" data-id="${it.id}" maxlength="2000" placeholder="자유롭게 적어 주세요">${esc(v||'')}</textarea>`;
  }
  let err = '응답해 주세요.';
  if (it.type === 'matrix') err = '모든 항목에 응답해 주세요.';
  if (it.type === 'phone') err = '휴대폰 번호를 정확히 입력해 주세요. (예: 010-1234-5678)';
  if (it.type === 'number') err = `${it.min}~${it.max} 사이의 숫자로 입력해 주세요.`;
  if (it.etc) err = '응답해 주세요. 기타를 선택하셨다면 내용을 적어 주세요.';
  return h + `<p class="err" hidden>${esc(err)}</p></section>`;
}

let advTimer = null;
function autoAdvance(it){
  return; /* 자동 넘김 끔: 다음 버튼으로만 이동 */
  const pg = SURVEY.pages[step];
  if (!pg || pg.keep || pg.items.length !== 1 || !answered(it)) return;
  const here = step;
  clearTimeout(advTimer);
  advTimer = setTimeout(() => { if (step === here && !finished){ const n = $('#next'); if (n && !n.disabled) n.click(); } }, 400);
}
function smoothTo(el){ if (el) el.scrollIntoView({behavior: reduceMotion() ? 'auto' : 'smooth', block: el.classList && el.classList.contains('card') ? 'start' : 'center'}); }
function nextTarget(fromCard){
  const cards = Array.from(document.querySelectorAll('#view .card'));
  const i = cards.indexOf(fromCard);
  for (let j = i + 1; j < cards.length; j++){ const id = cards[j].id.slice(2); const it = curItems().find(x => x.id === id); if (it && !answered(it)) return cards[j]; }
  return $('#next');
}
function curItems(){ return SURVEY.pages[step].items; }

function bindItems(pg){
  document.querySelectorAll('[data-k][data-v]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.k, val = +b.dataset.v;
    ans[k] = val;
    b.parentElement.querySelectorAll('[data-v]').forEach(x => x.setAttribute('aria-checked', +x.dataset.v === val));
    const row = document.getElementById('r-' + k); if (row) row.classList.remove('missing');
    const card = b.closest('.card'); const it = pg.items.find(x => x.id === card.id.slice(2));
    clearMiss(it.id); saveDraft(); updateRemain();
    if (answered(it)){ if (SURVEY.pages[step].items.length === 1) autoAdvance(it); else setTimeout(() => smoothTo(nextTarget(card)), 150); }
  }));
  document.querySelectorAll('select[data-sk]').forEach(sel => sel.addEventListener('change', () => {
    const k = sel.dataset.sk; ans[k] = sel.value === '' ? null : +sel.value;
    const row = document.getElementById('r-' + k); if (row && ans[k] != null) row.classList.remove('missing');
    const card = sel.closest('.card'); const it = pg.items.find(x => x.id === card.id.slice(2));
    clearMiss(it.id); saveDraft(); updateRemain();
    if (answered(it)) autoAdvance(it);
  }));
  document.querySelectorAll('[data-id][data-v]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.id, val = +b.dataset.v, it = pg.items.find(x=>x.id===id);
    const card = document.getElementById('c-' + id);
    if (it.type === 'multi'){
      let arr = Array.isArray(ans[id]) ? ans[id].slice() : [];
      const k = arr.indexOf(val);
      if (k >= 0) arr.splice(k,1);
      else {
        if (it.exclusive && val === it.exclusive) arr = [];
        else if (it.exclusive) arr = arr.filter(x => x !== it.exclusive);
        if (it.max && arr.length >= it.max){ showMax(card, it.max); return; }
        arr.push(val);
      }
      arr.sort((a,b)=>a-b); ans[id] = arr;
      card.querySelectorAll('[data-v]').forEach(x => x.setAttribute('aria-checked', arr.includes(+x.dataset.v)));
      const e = document.getElementById('etc-'+id); if (e){ e.hidden = !arr.includes(it.etc); if(!e.hidden && val === it.etc) e.focus(); }
      hideMax(card);
    } else {
      ans[id] = val;
      b.parentElement.querySelectorAll('[data-v]').forEach(x => x.setAttribute('aria-checked', +x.dataset.v === val));
      const e = document.getElementById('etc-'+id); if (e){ e.hidden = val !== it.etc; if(!e.hidden) e.focus(); }
      if (pg.items.some(x => x.showIf && x.showIf.q === id)) { clearMiss(id); saveDraft(); keepScroll(render); return; }
      if (!(it.etc && val === it.etc)){ if (SURVEY.pages[step].items.length === 1) autoAdvance(it); else setTimeout(() => smoothTo(nextTarget(card)), 120); }
    }
    clearMiss(id); saveDraft(); updateRemain();
  }));
  document.querySelectorAll('input.num[data-id]').forEach(t => {
    t.addEventListener('input', () => { const d = digitsOf(t.value); if (d !== t.value) t.value = d; ans[t.dataset.id] = d; clearMiss(t.dataset.id); saveDraft(); });
    t.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); smoothTo(nextTarget(t.closest('.card'))); } });
  });
  document.querySelectorAll('input[type=tel][data-id]').forEach(t => t.addEventListener('input', () => { ans[t.dataset.id] = t.value; clearMiss(t.dataset.id); saveDraft(); }));
  document.querySelectorAll('textarea[data-id]').forEach(t => t.addEventListener('input', () => { ans[t.dataset.id] = t.value; clearMiss(t.dataset.id); saveDraft(); }));
  document.querySelectorAll('input[id^="etc-"]').forEach(t => t.addEventListener('input', () => { etcText[t.id.slice(4)] = t.value; clearMiss(t.id.slice(4)); saveDraft(); }));
}
function showMax(card, n){ let m = card.querySelector('.maxmsg'); if (!m){ m = document.createElement('p'); m.className = 'maxmsg'; card.appendChild(m); } m.textContent = `최대 ${n}개까지 선택할 수 있습니다. 다른 항목을 고르려면 선택한 항목을 먼저 해제해 주세요.`; }
function hideMax(card){ const m = card.querySelector('.maxmsg'); if (m) m.remove(); }
function updateRemain(){ if (step >= 0 && step < SURVEY.pages.length) $('#progtx').textContent = '약 ' + remainMin() + '분 남음'; }
function keepScroll(fn){ const y = window.scrollY; fn(); window.scrollTo(0, y); }
function clearMiss(id){ const c = document.getElementById('c-'+id); if (c){ const it = curItems().find(x => x.id === id); if (!it || !invalid(it)){ c.classList.remove('missing'); c.querySelector('.err').hidden = true; } } const m = document.getElementById('msg'); if (m && !document.querySelector('.card.missing')) m.innerHTML = ''; }

function bindNav(){
  const n = $('#next'), p = $('#prev');
  if (p) p.onclick = () => { clearTimeout(advTimer); if (step === 0){ step = -1; } else step--; render(); window.scrollTo(0,0); };
  n.onclick = () => {
    const pg = SURVEY.pages[step];
    const miss = pg.items.filter(it => visible(it) && invalid(it));
    if (miss.length){
      miss.forEach(it => {
        const c = document.getElementById('c-'+it.id); c.classList.add('missing'); const er = c.querySelector('.err'); if (!er.dataset.base) er.dataset.base = er.textContent; er.textContent = errMsg(it) || er.dataset.base; er.hidden = false;
        if (it.type === 'matrix') it.rows.forEach((r, i) => { const k = rowKey(it, i); if (ans[k] == null) document.getElementById('r-'+k).classList.add('missing'); });
      });
      $('#msg').innerHTML = `<div class="banner">응답하지 않은 문항이 ${miss.length}개 있습니다.</div>`;
      const first = document.getElementById('c-'+miss[0].id);
      const firstRow = first.querySelector('.mtr.missing');
      (firstRow || first).scrollIntoView({behavior: reduceMotion() ? 'auto' : 'smooth', block: firstRow ? 'center' : 'start'});
      return;
    }
    if (pg.endIf && pg.endIf.in.includes(ans[pg.endIf.q])){ submit(n, 'declined'); return; }
    if (step === SURVEY.pages.length - 1){ submit(n, 'done'); return; }
    step++; saveDraft(); render(); window.scrollTo(0,0);
  };
}

function payload(){
  const cols = ['응답일시','소요시간(초)'], row = [new Date().toLocaleString('ko-KR'), Math.round((Date.now()-startedAt)/1000)];
  const book = [];
  cols.push('CONSENT'); row.push(ans.CONSENT == null ? '' : ans.CONSENT); book.push(['CONSENT', '설문 참여 동의', '1=동의, 2=비동의']);
  if (ans.CONSENT === 2){ return {cols, row, book, prize: null}; }
  SURVEY.pages.forEach(pg => pg.items.forEach(it => {
    if (it.private) return;
    const shown = visible(it);
    const title = (it.n ? it.n + '. ' : '') + it.text;
    if (it.type === 'matrix'){
      const lab = it.cols.map(c => `${c[1]}=${c[0]}`).join(', ');
      it.rows.forEach((r, i) => { const k = rowKey(it, i); cols.push(k); row.push(shown && ans[k] != null ? ans[k] : ''); book.push([k, `${title} - ${i+1}) ${r}`, lab]); });
    } else if (it.type === 'multi'){
      it.options.forEach((o,i) => { cols.push(`${it.id}_${i+1}`); row.push(shown ? ((ans[it.id]||[]).includes(i+1) ? 1 : 0) : ''); book.push([`${it.id}_${i+1}`, title, `${o} (선택=1, 미선택=0)`]); });
      if (it.etc){ cols.push(`${it.id}_기타`); row.push(shown ? (etcText[it.id]||'') : ''); book.push([`${it.id}_기타`, `${title} - 기타 응답`, '서술형']); }
    } else {
      let val = shown ? (ans[it.id] == null ? '' : ans[it.id]) : '';
      if (it.type === 'number' && val !== '') val = Number(digitsOf(val));
      cols.push(it.id); row.push(val);
      const lab = it.type === 'text' ? '서술형' : it.type === 'number' ? `숫자(${it.unit})` : it.options.map((o,i)=>`${i+1}=${o}`).join(', ');
      book.push([it.id, title, lab]);
      if (it.type === 'single' && it.etc){ cols.push(`${it.id}_기타`); row.push(shown && ans[it.id] === it.etc ? (etcText[it.id]||'') : ''); book.push([`${it.id}_기타`, `${title} - 기타 응답`, '서술형']); }
    }
  }));
  const prize = (ans.AGREE === 1 && phoneOk(ans.PHONE)) ? {phone: phoneFmt(ans.PHONE)} : null;
  return {cols, row, book, prize};
}

function submit(btn, kind){
  btn.disabled = true; btn.textContent = '제출하는 중…';
  const ok = () => { clearDraft(); try{ if (kind === 'done') localStorage.setItem(DONEKEY, '1'); }catch(e){}; finished = kind; render(); window.scrollTo(0,0); };
  const fail = () => { btn.disabled = false; btn.textContent = '다시 제출하기'; $('#msg').innerHTML = '<div class="banner">제출하지 못했습니다. 인터넷 연결을 확인한 뒤 다시 눌러 주세요. 입력하신 답은 그대로 남아 있습니다.</div>'; };
  const data = payload();
  if (LIVE){ google.script.run.withSuccessHandler(ok).withFailureHandler(fail).submit(data); }
  else if (ENDPOINT){
    fetch(ENDPOINT, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(data)}).then(ok).catch(fail);
  }
  else { setTimeout(ok, 400); }
}

function doneHTML(){
  const msg = finished === 'declined' ? SURVEY.declined : SURVEY.thanks;
  return `<div class="done"><div class="ck"></div><h2>${finished === 'declined' ? '설문을 종료합니다' : '응답이 제출되었습니다'}</h2><p>${esc(msg)}</p>${finished === 'done' && SURVEY.contact ? `<p class="contact">${esc(SURVEY.contact)}</p>` : ''}</div>
  ${!DEMO ? '' : '<p class="demo">미리보기 화면이라 응답은 저장되지 않았습니다.</p>'}`;
}

render();
</script>
